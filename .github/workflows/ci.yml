name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  test-action:
    name: Test Action
    runs-on: ubuntu-latest
    needs: lint-workflows
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup maintenance Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install checker dependencies
        run: pnpm install --frozen-lockfile

      - name: Check fixture and verification types
        run: pnpm typecheck

      - name: Test default export and JSON result
        id: default
        uses: ./
        with:
          ts-file: .github/fixtures/default.ts
          args: '{"message":"Hello from test! $(touch .github-script-args-executed)"}'

      - name: Test named export, literal entry path and string result
        id: named
        uses: ./
        with:
          ts-file: .github/fixtures/literal $(touch .github-script-input-executed).ts
          args: '{"message":"literal string result"}'
          result-encoding: string

      - name: Reject a missing entry
        id: build-failure
        continue-on-error: true
        uses: ./
        with:
          ts-file: .github/fixtures/does-not-exist.ts

      - name: Reject a missing callable export
        id: export-failure
        continue-on-error: true
        uses: ./
        with:
          ts-file: .github/fixtures/missing-export.ts

      - name: Reject invalid JSON arguments
        id: args-failure
        continue-on-error: true
        uses: ./
        with:
          ts-file: .github/fixtures/default.ts
          args: '{'

      - name: Propagate a script error
        id: script-failure
        continue-on-error: true
        uses: ./
        with:
          ts-file: .github/fixtures/throws.ts

      - name: Verify results and failures
        env:
          DEFAULT_RESULT: ${{ steps.default.outputs.result }}
          NAMED_RESULT: ${{ steps.named.outputs.result }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          BUILD_OUTCOME: ${{ steps.build-failure.outcome }}
          EXPORT_OUTCOME: ${{ steps.export-failure.outcome }}
          ARGS_OUTCOME: ${{ steps.args-failure.outcome }}
          SCRIPT_OUTCOME: ${{ steps.script-failure.outcome }}
        run: node .github/scripts/verify-action-result.ts
