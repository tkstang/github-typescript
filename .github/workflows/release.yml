name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - name: Validate the tag, version and exact commit
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: node .github/scripts/release.ts validate

  checks:
    name: Check tagged revision
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.validate-tag.outputs.commit }}

  create-release:
    name: Create release and update stable major
    needs: [validate-tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate-tag.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - name: Revalidate before release writes
        run: node .github/scripts/release.ts validate
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          target_commitish: ${{ needs.validate-tag.outputs.commit }}
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
      - name: Update stable major ref without deleting it
        if: needs.validate-tag.outputs.prerelease == 'false'
        run: node .github/scripts/release.ts update-major
